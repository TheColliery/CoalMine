name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 2'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: read

# cancel-in-progress: FALSE, deliberately. Unlike the read-only workflows here, Scorecard
# UPLOADS a SARIF to code scanning and (with publish_results) posts to the OpenSSF API --
# outward writes, where a cancellation mid-publish is a partially-applied result rather than a
# discarded one. It is also schedule-driven, so overlap is rare and queueing costs nothing.
#
# THIS DISAGREES WITH codeql.yml, WHICH CANCELS, AND THAT IS DELIBERATE (CWK-074). Both upload a
# SARIF, so the SARIF is not the discriminator. CodeQL publishes ONLY to GitHub code scanning,
# where a missed upload leaves the prior analysis standing; this workflow ALSO posts to the
# OpenSSF API, a third-party endpoint we do not control, where a cancelled publish can be
# partially applied. The two comments cross-reference each other so a reader who notices the
# difference finds the reason rather than an apparent contradiction.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: results.sarif
