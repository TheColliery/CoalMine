# DIVERGENCE FROM THE OVERLAY CANON (derived 2026-10-08 by diffing this file against the overlay blob
# 276a7c6c36101c03e89e7cea2766fce76d90618d, TheColliery/.github 52edc8e, line endings ignored). EXACTLY ONE difference:
#   this file lacks the canon step named "Check the derive step wrote its four release files (a stale release-notes.mjs
#   stops here)", which sits between "Derive the canon Release title + body from CHANGELOG.md" and "Check the tag carries
#   its own packaging scripts". It is the canon's guard for a room that kept an older scripts/release-notes.mjs; this room
#   holds the canon's release-notes.mjs (blob f8d998d8, adopted 05a, re-synced 08c), so nothing it guards can happen here today. The
#   reason it is absent is only that this file was last adopted (4dd17d7, 2026-10-02) before the canon added the step; no
#   decision to omit it was ever taken. Adopting it is a non-comment change to this workflow, left to its own unit.
# NOT divergences (the canon carries them too, so this file already matches): timeout-minutes, persist-credentials: false
#   on both checkouts, and the tag input reaching the script only through env.
name: claude-ai-zips

# claude.ai installs skills as a ZIP only, and its skill-listing description cap is 200
# chars vs our own cross-platform 1024 (desc-cap.mjs). For one tag: stage every
# skill with its description deterministically trimmed to the platform cap
# (scripts/build-claude-ai-zips.mjs — a DERIVED artifact, source skills/*/SKILL.md is
# never edited), zip each staged directory, and attach the ZIPs to the GitHub Release
# as assets. The user downloads a ZIP from the Release and uploads it to claude.ai
# directly. Canonical exemplar: CoalMine (board #40 / C2-v2 design).
#
# TWO WAYS IN, ONE WRITER (UMB-182 posting path; RELEASE-PATTERN.md, "The posting path for a tag that already exists"):
#   1. A stable tag push. The run is the tag's own: its CHANGELOG, its commit, its packaging scripts.
#   2. A workflow_dispatch run FROM THE DEFAULT BRANCH with a `tag` input naming a tag that already exists. A
#      dispatch run uses the workflow file as it stands on the branch it is run from, so this is the path for a
#      tag cut before its room carried this file. The Release is derived from the TAG's own CHANGELOG entry. WHAT
#      A BACK-FILLED RELEASE CARRIES: ZIP assets built from the tag's own tree by the tag's OWN packaging scripts
#      when the tag has them; none when the tag predates them, said out loud in the run. The bytes of a published
#      version come from that version, never from a newer script run over an older tree. `launch_form` posts ONE
#      pre-release tag as the repository's launch-form Release (prerelease: true, never Latest), and only while the
#      repository has no Release of another tag.
# A person never POSTs a Release by hand: a Release that is missing for an existing tag is posted by this machine.
#
# PUBLISH ORDER (common/git-workflow.md "Tags and Releases"; CWK-119; GitHub's immutable-releases rule): the Release is
# created as a DRAFT, every asset including SHA256SUMS.txt is attached, and only then is it published.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "An EXISTING tag (vX.Y.Z) to post the Release for, from that tag's own CHANGELOG entry. Run this workflow from the default branch."
        required: true
        type: string
      launch_form:
        description: "Post ONE pre-release tag (vX.Y.Z-label) as the launch-form Release (prerelease: true). Refused for a stable tag, and when the repository already has a Release of another tag."
        required: false
        type: boolean
        default: false

# Minimal top-level token (Scorecard Token-Permissions best practice); only the
# build-zips job escalates to the write scope it needs to create the Release and
# upload assets — never grant contents:write at the top level for a single job's need.
permissions:
  contents: read

# cancel-in-progress: FALSE, deliberately (AGENTS.md's UMB-052 CANON CORRECTIONS exhibit is
# THIS workflow's own class, cited not restated: CoalMine's prior v3.17.1 asset race, two
# overlapping claude-ai-zips runs uploading to the same tag). Serialising is the fix;
# CANCELLING is not, because a run killed mid-upload can leave the Release carrying a
# partial or missing ZIP with nothing to signal it -- a broken install path for a user,
# which is strictly worse than a slow one. The group is keyed on the TAG the run posts (the
# dispatch input, else the pushed tag), not the branch, because the asset collision is per-Release.
concurrency:
  group: claude-ai-zips-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-zips:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # testing.md: every run has a finite clock; a room re-sizes this from its own measured suite time
    permissions:
      contents: write # only this job creates the Release and uploads assets
    steps:
      # The `tag` input is untrusted text: it reaches this script ONLY through env, is matched against a strict
      # tag pattern, and is checked against the repository's real tags before anything is checked out or written.
      - name: "Resolve the tag this run posts: a stable tag push, or a dispatch from the default branch for an existing tag (a pre-release tag only as the launch form)"
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LAUNCH: ${{ inputs.launch_form }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          launch=false
          if [[ "${EVENT}" == "push" ]]; then
            tag="${REF_NAME}"
            if [[ "${REF_TYPE}" != "tag" ]]; then
              out "post=false"; echo "::notice::ref_type is '${REF_TYPE}', not a tag -- no Release to post"; exit 0
            elif [[ "${tag}" == *-* ]]; then
              out "post=false"; echo "::notice::${tag} is a pre-release tag -- Releases are stable-only; the repository's one launch-form Release is posted by a workflow_dispatch run with launch_form"; exit 0
            fi
          else
            tag="${INPUT_TAG}"; launch="${INPUT_LAUNCH}"
            if [[ "${REF_TYPE}" != "branch" || "${REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
              echo "::error::run this workflow from the default branch (${DEFAULT_BRANCH}), not from '${REF_NAME}': the tag to post is the input, never the ref"; exit 1
            fi
            if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "::error::the tag input is not a vX.Y.Z or vX.Y.Z-label tag"; exit 1
            fi
            # GitHub's "get a reference" call for a tag name answers 200 with a LIST when no ref is exactly <name> but some
            # START with it (v1.2.3 against v1.2.30), so this lists by prefix and compares the ref name exactly.
            if ! refs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${tag}" --jq '.[].ref' 2>/dev/null); then
              echo "::error::could not read this repository's tags from the GitHub API, so whether ${tag} exists is unknown; nothing was posted -- run it again"; exit 1
            fi
            if ! grep -Fxq -- "refs/tags/${tag}" <<< "${refs}"; then
              echo "::error::${tag} is not a tag of this repository -- this path posts a Release for a tag that already exists, it never creates a tag"; exit 1
            fi
            if [[ "${tag}" == *-* ]]; then
              if [[ "${launch}" != "true" ]]; then
                echo "::error::${tag} is a pre-release tag -- Releases are stable-only, except the ONE launch form: run again with launch_form"; exit 1
              fi
              others=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq "[.[] | select(.tag_name != \"${tag}\")] | length") || { echo "::error::could not list the repository's Releases"; exit 1; }
              if [[ "${others}" != "0" ]]; then
                echo "::error::the launch form is the repository's ONE pre-release Release, posted only while it has no Release of another tag (found ${others})"; exit 1
              fi
            elif [[ "${launch}" == "true" ]]; then
              echo "::error::launch_form is for a pre-release tag; ${tag} is stable"; exit 1
            fi
          fi
          out "post=true"; out "tag=${tag}"; out "launch=${launch}"
          echo "posting the Release for ${tag} (launch form: ${launch})"

      # `canon` = the workflow's own commit: the default branch on a dispatch, the tag on a push. Its scripts
      # derive and verify. `tag-src` = the tag's own tree: its CHANGELOG, its skills, its packaging scripts.
      - name: Check out the canon scripts (this workflow's own commit)
        if: steps.gate.outputs.post == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job pushes nothing, so the workflow token has no business staying in .git/config for the
          # rest of the job, readable by every later step (SKILL-REPO-PATTERN.md, Layer 5).
          persist-credentials: false
          path: canon

      - name: Check out the tag being posted (its own CHANGELOG and tree)
        if: steps.gate.outputs.post == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ steps.gate.outputs.tag }}
          path: tag-src
          fetch-depth: 0 # the heading-continuity check needs the previous stable tag (git describe)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.post == 'true'
        with:
          node-version: 24

      # UMB-162 (a), "WRITE ONCE, DERIVE EVERYTHING" (owner-proposed, main-confirmed
      # 2026-09-21): the CHANGELOG entry -- heading + a required one-line summary -- is the
      # ONE thing a person writes. The Release title and body are DERIVED from it here, never
      # composed by hand at press time; see RELEASE-PATTERN.md's own section for the full
      # rule. scripts/release-notes.mjs fails loud (non-zero exit) on a missing/mismatched/
      # summary-less entry -- a malformed CHANGELOG must stop the release, never fall back to
      # a bare-titled one (UMB-162's own root cause).
      # UMB-182: the previous stable tag feeds the CHANGELOG heading-continuity check (courier C-2);
      # the current Latest decides make_latest, so a Release for an older tag never takes Latest.
      # A 404 on releases/latest means the repo has no Latest yet; any other failure stops the run,
      # never a guess that could move Latest. The launch form has no previous stable tag.
      - name: Read the previous stable tag and the current Latest release
        if: steps.gate.outputs.post == 'true'
        working-directory: tag-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_TAG: ${{ steps.gate.outputs.tag }}
          POST_LAUNCH: ${{ steps.gate.outputs.launch }}
        run: |
          set -uo pipefail
          prev=''
          if [[ "${POST_LAUNCH}" != "true" ]]; then
            prev=$(git describe --tags --abbrev=0 --exclude='*-*' "${POST_TAG}^" 2>/dev/null || true)
          fi
          if latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>latest-err.txt); then :
          elif grep -q 'HTTP 404' latest-err.txt; then latest=''
          else cat latest-err.txt >&2; echo "::error::could not read the current Latest release"; exit 1; fi
          echo "RELEASE_TAG=${POST_TAG}" >> "$GITHUB_ENV"
          echo "LAUNCH_FORM=${POST_LAUNCH}" >> "$GITHUB_ENV"
          echo "PREVIOUS_STABLE_TAG=${prev}" >> "$GITHUB_ENV"
          echo "LATEST_TAG=${latest}" >> "$GITHUB_ENV"
          echo "previous stable tag: ${prev:-none} · current Latest: ${latest:-none}"

      - name: Derive the canon Release title + body from CHANGELOG.md
        if: steps.gate.outputs.post == 'true'
        working-directory: tag-src
        run: node ../canon/scripts/release-notes.mjs

      # A tag that predates the packaging scripts (a back-fill through the dispatch path) gets a Release
      # without ZIPs, said out loud; a pushed tag that lacks them is a defect and stops the run.
      - name: Check the tag carries its own packaging scripts
        id: pkg
        if: steps.gate.outputs.post == 'true'
        working-directory: tag-src
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ -f scripts/verify.mjs && -f scripts/build-claude-ai-zips.mjs ]]; then
            echo "package=true" >> "$GITHUB_OUTPUT"
          elif [[ "${EVENT}" == "push" ]]; then
            echo "::error::this tag has no scripts/verify.mjs or scripts/build-claude-ai-zips.mjs -- a pushed tag must carry its own packaging scripts"; exit 1
          else
            echo "package=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${RELEASE_TAG} predates the packaging scripts: its Release is posted WITHOUT ZIP assets (a published version's bytes come from that version, never from a newer script run over an older tree)"
          fi

      - name: Verify plugin/ dist is current (fail loud, never zip a stale dist)
        if: steps.pkg.outputs.package == 'true'
        working-directory: tag-src
        run: node scripts/verify.mjs

      - name: Stage trimmed-description skill directories
        if: steps.pkg.outputs.package == 'true'
        working-directory: tag-src
        run: node scripts/build-claude-ai-zips.mjs

      - name: Zip each staged skill directory
        if: steps.pkg.outputs.package == 'true'
        working-directory: tag-src
        run: |
          set -euo pipefail
          cd -- dist-claude-ai
          for d in */; do
            name="${d%/}"
            # zip refuses "--" before the archive name, so a name that could read as an option is refused here instead.
            [[ "${name}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::skill directory name '${name}' is not a plain name"; exit 1; }
            zip -r "${name}.zip" "${name}" -x "${name}/.*"
          done
          ls -la -- *.zip

      # claude.ai's own page (read 2026-10-02): the ZIP must contain the skill FOLDER as its top level, because Claude
      # looks for <skill-name>/SKILL.md inside the archive, and a SKILL.md at the root "isn't recognized as a skill".
      # This is the vendor's own check (unzip -l: SKILL.md must carry the <name>/ prefix), run on every archive
      # before the Release is created or any asset is attached.
      - name: Check each ZIP holds its skill folder as the top level (the vendor's own unzip -l check)
        if: steps.pkg.outputs.package == 'true'
        working-directory: tag-src
        run: |
          set -euo pipefail
          cd -- dist-claude-ai
          shopt -s nullglob
          zips=(*.zip)
          [[ ${#zips[@]} -gt 0 ]] || { echo "::error::no ZIP was built"; exit 1; }
          for z in "${zips[@]}"; do
            name="${z%.zip}"
            entries=$(unzip -Z1 -- "$z")
            outside=$(printf '%s\n' "$entries" | awk -v p="${name}/" 'index($0, p) != 1' | head -n 1)
            if [[ -n "$outside" ]]; then
              echo "::error::$z has an entry outside ${name}/ ('$outside'): the ZIP must hold the skill folder itself as its top level (zip the folder, not its contents)"; exit 1
            fi
            printf '%s\n' "$entries" | grep -Fxq -- "${name}/SKILL.md" || { echo "::error::$z has no ${name}/SKILL.md"; exit 1; }
          done
          echo "every ZIP holds <name>/SKILL.md as its top level"

      - name: Generate SHA256SUMS.txt for the ZIPs
        if: steps.pkg.outputs.package == 'true'
        working-directory: tag-src
        run: |
          set -euo pipefail
          cd -- dist-claude-ai
          sha256sum -- *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # This workflow is now the SOLE Release creator (UMB-162 (a)) -- a head no longer POSTs
      # a Release by hand, so the race this step used to guard against (a separate REST call
      # racing this trigger) is retired by construction. The one race that remains is a
      # re-run of THIS SAME workflow for a tag it already created a Release for
      # -- `concurrency: cancel-in-progress: false` above serializes a genuinely
      # concurrent run, so this is a re-run AFTER an earlier one already finished (or partly
      # finished). `edit`, not a bare `view`, so a re-run always converges the title/body back
      # to the derived canon shape, idempotently, rather than merely confirming something
      # exists. A NEW Release is created as a DRAFT and published only after its assets are attached
      # (the publish step below); a re-run's edit leaves a published Release published. gh finds a draft by its
      # tag name. `--latest` is NOT passed on the draft create (GitHub: a draft cannot be Latest); the publish step
      # applies it.
      - name: Ensure the GitHub Release exists, with the derived canon title + body
        if: steps.gate.outputs.post == 'true'
        working-directory: tag-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" --verify-tag --draft --title "$(cat release-title.txt)" --notes-file release-body.md --prerelease="$(cat release-prerelease.txt)" || \
            gh release edit "${RELEASE_TAG}" --title "$(cat release-title.txt)" --notes-file release-body.md --latest="$(cat release-latest.txt)" --prerelease="$(cat release-prerelease.txt)" || \
            { echo "::error::release create failed AND release edit failed -- this is not the expected already-exists race" >&2; exit 1; }

      # RELEASE-PATTERN.md "A Release body is re-read after every write", MUST -- a 200 on the
      # create/edit call above is evidence the request was well-formed, never evidence the
      # body it carried survived transport intact. SHA256 over UTF-8 bytes, never a length
      # compare (the exact rail that caught the PS 5.1 ETS-decoration and em-dash-mangling
      # incidents this file's own canon cites).
      - name: Verify the published Release matches the derived title + body (byte-exact re-read)
        if: steps.gate.outputs.post == 'true'
        working-directory: tag-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${RELEASE_TAG}" --json name,body | node ../canon/scripts/verify-release-shape.mjs

      # UMB-163's named divergence, closed here: `--clobber` used to run unconditionally on
      # every invocation of this workflow, silently overwriting whatever a prior run had
      # already published. Best-effort: absent on a genuine first run (nothing to download),
      # which is the expected, non-error case -- `|| true` only swallows THAT, never a real
      # network failure the next step would then also need to distinguish (out of scope here;
      # a transient download failure surfaces as "no existing file" and is treated the same as
      # first-run, the safe direction).
      - name: Check for an already-published SHA256SUMS.txt on this tag's Release
        if: steps.pkg.outputs.package == 'true'
        working-directory: tag-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${RELEASE_TAG}" -p 'SHA256SUMS.txt' -O existing-SHA256SUMS.txt --clobber 2>/dev/null || true

      # UMB-182 M1, measured: zip stores mtimes, so a re-run of a tag whose assets are already
      # published ends RED here, and that red is the safe outcome (nothing is overwritten; a fully
      # published tag has nothing left to do). A run that died before SHA256SUMS.txt was uploaded
      # finds no prior file and uploads normally. scripts/lib/asset-upload-mode.mjs has the detail.
      - name: Decide whether to upload, skip, or fail (a published version must never silently change)
        id: decide
        if: steps.pkg.outputs.package == 'true'
        working-directory: tag-src
        run: |
          ACTION=$(node ../canon/scripts/decide-upload.mjs dist-claude-ai/SHA256SUMS.txt existing-SHA256SUMS.txt)
          echo "action=${ACTION}" >> "$GITHUB_OUTPUT"

      - name: Attach ZIPs + SHA256SUMS.txt to the GitHub Release for this tag
        if: steps.pkg.outputs.package == 'true' && steps.decide.outputs.action == 'upload-clobber'
        working-directory: tag-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG}" dist-claude-ai/*.zip dist-claude-ai/SHA256SUMS.txt --clobber

      # Last: the Release goes public only now that every asset is attached (a draft that stays a draft is
      # the loud failure; a published Release with a missing asset is the silent one). `--latest` and
      # `--prerelease` are applied here as well, because a draft carries neither until it is published.
      - name: Publish the Release last (after its re-read and any assets), and re-read that it is no longer a draft
        if: steps.gate.outputs.post == 'true'
        working-directory: tag-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${RELEASE_TAG}" --draft=false --latest="$(cat release-latest.txt)" --prerelease="$(cat release-prerelease.txt)"
          state=$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)
          [[ "${state}" == "false" ]] || { echo "::error::${RELEASE_TAG} is still a draft after the publish step" >&2; exit 1; }

      # UMB-163 step 2 (design), step 3 signed 2026-09-21 ("ใช่ เก็บ 2 ล็อกเลย", N=2): keeps
      # the ZIP assets of the newest stable Release plus ONE previous, prunes the ZIPs (never
      # the Release record, never the tag) off everything older. OFF by default -- a room's
      # head opts in per repo via the `PRUNE_OLD_RELEASE_ZIPS` Actions variable (Settings ->
      # Secrets and variables -> Actions -> Variables); nothing here prunes anything until
      # that variable reads exactly "true", checked twice (the `if:` below, and again inside
      # the script itself -- never trust one gate alone for a destructive action).
      - name: Prune older stable release ZIP assets (kept latest + 1 previous; flag-gated, default OFF)
        if: steps.gate.outputs.post == 'true' && vars.PRUNE_OLD_RELEASE_ZIPS == 'true'
        working-directory: tag-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRUNE_OLD_RELEASE_ZIPS: ${{ vars.PRUNE_OLD_RELEASE_ZIPS }}
        run: node ../canon/scripts/prune-release-zips.mjs
